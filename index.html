<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Plinko</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#15132e;--ink:#f1ecff;--dim:#8f89b8;--btn:#ff6b9d;--card:#221f47}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:420px;flex:1;min-height:0;gap:12px}
.screen.on{display:flex}
#menu,#over{justify-content:center}
h1{font-size:48px;letter-spacing:1px}
h2{font-size:26px}
.sub{color:var(--dim);font-size:15px;text-align:center}
button{width:100%;padding:16px;border:0;border-radius:16px;background:var(--btn);color:#1b0f1f;font:700 18px inherit;font-family:inherit;cursor:pointer;transition:transform .08s}
button.alt{background:var(--card);color:var(--ink)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.top{width:100%;display:flex;justify-content:space-between;align-items:baseline}
.top b{font-size:34px;font-variant-numeric:tabular-nums}
.top span{color:var(--dim);font-size:14px}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
canvas{display:block}
ol{list-style:none;width:100%;padding:0;flex:1;overflow:auto}
li{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}
li .n{color:var(--dim);width:24px;font-variant-numeric:tabular-nums}
li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .sc{font-weight:800;font-variant-numeric:tabular-nums}
li.me{outline:2px solid #ffd166}
.big{font-size:64px;font-weight:800;color:#ffd166}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <h1>Plinko</h1>
  <p class="sub">10 balls. Pick your moment and drop.</p>
  <button id="bPlay">Play</button>
  <button id="bLb" class="alt">Leaderboard</button>
</section>

<section id="game" class="screen">
  <div class="top">
    <div><span>Score</span><br><b id="score">0</b></div>
    <div style="text-align:right"><span>Balls</span><br><b id="left">10</b></div>
  </div>
  <div id="wrap"><canvas id="c"></canvas></div>
  <button id="go">Drop</button>
</section>

<section id="over" class="screen">
  <h2>Game over</h2>
  <div class="big" id="final">0</div>
  <p class="sub" id="rank"></p>
  <button id="bAgain">Play again</button>
  <button id="bLb2" class="alt">Leaderboard</button>
  <button id="bMenu" class="alt">Menu</button>
</section>

<section id="lb" class="screen">
  <h2>Leaderboard</h2>
  <p class="sub">Best score per player</p>
  <ol id="list"></ol>
  <button id="bBack" class="alt">Back</button>
</section>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#15132e'); tg.setBackgroundColor('#15132e'); } catch (e) {} }
const $ = id => document.getElementById(id);

const W = 360, H = 560, R = 7, PR = 4, SLOT = W / 11, FLOOR = 470, TOTAL = 10;
const MULT = [1, 0.5, 3, 0.5, 0.2, 10, 0.2, 0.5, 3, 0.5, 1];
const cv = $('c'), ctx = cv.getContext('2d'), wrap = $('wrap');
let scale = 1, dpr = window.devicePixelRatio || 1;

const pegs = [];
for (let r = 0; r < 9; r++) {
  const odd = r % 2, n = odd ? 10 : 11;
  for (let k = odd ? 0 : 1; k < (odd ? n : n - 1); k++) pegs.push({ x: (odd ? SLOT : SLOT / 2) + k * SLOT, y: 90 + r * 38 });
}

let balls = [], popups = [], score = 0, left = TOTAL, playing = false;
let dx = W / 2, dir = 1, lastEntry = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
  if (id === 'game') resize();
  if (id === 'lb') renderLb();
}

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  scale = Math.min(w / W, h / H, 1.4);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = W * scale * dpr;
  cv.height = H * scale * dpr;
}
window.addEventListener('resize', resize);

/* таблица лидеров (хранится на устройстве) */
function loadLb() {
  let a = [];
  try { a = JSON.parse(localStorage.getItem('plinko_lb')) || []; } catch (e) {}
  const best = {};
  a.forEach(e => { const k = e.id || e.n; if (!best[k] || e.s > best[k].s) best[k] = e; });
  return Object.values(best).sort((x, y) => y.s - x.s);
}
function playerId() {
  try { const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; if (u && u.id) return 'tg' + u.id; } catch (e) {}
  return 'local';
}
function saveLb(a) { try { localStorage.setItem('plinko_lb', JSON.stringify(a)); } catch (e) {} }
function playerName() {
  try { const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; if (u && u.first_name) return u.first_name; } catch (e) {}
  return 'Player';
}
function renderLb() {
  const a = loadLb(), ul = $('list');
  ul.innerHTML = '';
  if (!a.length) { ul.innerHTML = '<p class="sub">Nothing here yet. Play your first game!</p>'; return; }
  a.forEach((e, i) => {
    const li = document.createElement('li');
    if (e === lastEntry || (lastEntry && e.t === lastEntry.t)) li.className = 'me';
    li.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="nm"></span><span class="sc">' + e.s + '</span>';
    li.querySelector('.nm').textContent = e.n;
    ul.appendChild(li);
  });
}

/* игра */
function startGame() {
  score = 0; left = TOTAL; balls = []; popups = []; playing = true; dx = W / 2; dir = 1;
  hud(); show('game');
}
function hud() {
  $('score').textContent = score;
  $('left').textContent = left;
  $('go').disabled = left <= 0;
}
function launch() {
  if (!playing || left <= 0) return;
  left--; hud();
  balls.push({ x: dx, y: 22, vx: (Math.random() - .5) * 20, vy: 0, landed: false, t: 0, slot: 0 });
}
function finish() {
  playing = false;
  const id = playerId(), name = playerName(), a = loadLb();
  let e = a.find(x => x.id === id || (!x.id && (x.n === name || x.n === 'Игрок'))), improved = false;
  if (!e) { e = { id, n: name, s: score, t: Date.now() }; a.push(e); improved = true; }
  else {
    e.id = id; e.n = name;
    if (score > e.s) { e.s = score; e.t = Date.now(); improved = true; }
  }
  a.sort((x, y) => y.s - x.s);
  const top = a.slice(0, 10);
  saveLb(top);
  lastEntry = e;
  const rank = top.indexOf(e) + 1;
  $('final').textContent = score;
  $('rank').textContent = improved
    ? 'New record! ' + (rank ? 'Rank: ' + rank : '')
    : 'Your best: ' + e.s + '. Try to beat it!';
  setTimeout(() => show('over'), 500);
}
function land(b) {
  const pts = Math.round(MULT[b.slot] * 10);
  score += pts; hud();
  popups.push({ x: b.slot * SLOT + SLOT / 2, y: 455, t: 0, text: '+' + pts, big: MULT[b.slot] >= 3 });
  try {
    if (tg && tg.HapticFeedback) {
      if (MULT[b.slot] >= 3) tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred('light');
    }
  } catch (e) {}
}

function step(dt) {
  if (playing && left > 0) {
    dx += dir * 170 * dt;
    if (dx > W - R - 4) { dx = W - R - 4; dir = -1; }
    if (dx < R + 4) { dx = R + 4; dir = 1; }
  }
  for (const b of balls) {
    if (b.landed) {
      b.t += dt;
      const cx = b.slot * SLOT + SLOT / 2;
      b.x += (cx - b.x) * Math.min(1, dt * 12);
      b.y += (522 - b.y) * Math.min(1, dt * 10);
      if (b.t > 0.4 && !b.done) { b.done = true; land(b); }
      continue;
    }
    b.vy += 900 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    for (const p of pegs) {
      const ddx = b.x - p.x, ddy = b.y - p.y, d = Math.hypot(ddx, ddy), m = R + PR;
      if (d < m && d > 0) {
        const nx = ddx / d, ny = ddy / d;
        b.x = p.x + nx * m; b.y = p.y + ny * m;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          b.vx -= 1.55 * vn * nx; b.vy -= 1.55 * vn * ny;
          b.vx += (Math.random() - .5) * 30;
        }
      }
    }
    if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx) * .5; }
    if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx) * .5; }
    b.still = Math.hypot(b.vx, b.vy) < 25 ? (b.still || 0) + dt : 0;
    if (b.still > 0.35) { b.vx = (Math.random() - .5) * 140; b.vy = -40; b.still = 0; }
    if (b.y > FLOOR) {
      b.landed = true; b.t = 0;
      b.slot = Math.max(0, Math.min(10, Math.floor(b.x / SLOT)));
    }
  }
  balls = balls.filter(b => !(b.done && b.t > 0.45));
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 0.9);
  if (playing && left === 0 && balls.length === 0 && popups.length === 0) finish();
}

function slotColor(m) { return m >= 10 ? '#ff6b9d' : m >= 3 ? '#ffd166' : m >= 1 ? '#7be0c3' : '#6c63b5'; }

function draw() {
  if (!$('game').classList.contains('on')) return;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center';
  for (let i = 0; i < 11; i++) {
    ctx.globalAlpha = .22; ctx.fillStyle = slotColor(MULT[i]);
    ctx.fillRect(i * SLOT + 1, FLOOR, SLOT - 2, 70);
    ctx.globalAlpha = 1; ctx.fillStyle = slotColor(MULT[i]);
    ctx.font = '700 12px system-ui,sans-serif';
    ctx.fillText('×' + MULT[i], i * SLOT + SLOT / 2, 494);
  }
  ctx.strokeStyle = '#8f89b8'; ctx.lineWidth = 2;
  for (let i = 0; i <= 11; i++) { ctx.beginPath(); ctx.moveTo(i * SLOT, FLOOR + 6); ctx.lineTo(i * SLOT, 560); ctx.stroke(); }
  /* рельс и ездящий шарик */
  if (playing && left > 0) {
    ctx.strokeStyle = 'rgba(143,137,184,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(4, 22); ctx.lineTo(W - 4, 22); ctx.stroke();
    ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(dx, 34); ctx.lineTo(dx, 80); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(dx, 22, R, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#f1ecff';
  for (const p of pegs) { ctx.beginPath(); ctx.arc(p.x, p.y, PR, 0, 7); ctx.fill(); }
  for (const b of balls) {
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, 2, 0, 7); ctx.fill();
  }
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / .9;
    ctx.fillStyle = p.big ? '#ffd166' : '#f1ecff';
    ctx.font = '800 ' + (p.big ? 20 : 16) + 'px system-ui,sans-serif';
    ctx.fillText(p.text, p.x, p.y - p.t * 50);
  }
  ctx.globalAlpha = 1;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  step(dt / 2); step(dt / 2);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$('bPlay').onclick = startGame;
$('bAgain').onclick = startGame;
$('bLb').onclick = () => show('lb');
$('bLb2').onclick = () => show('lb');
$('bMenu').onclick = () => show('menu');
$('bBack').onclick = () => show('menu');
$('go').onclick = launch;
</script>
</body>
</html>
